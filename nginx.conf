server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx-proxy strips /ngram/ before forwarding to this static server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CRA fingerprints these assets; missing assets must not return HTML.
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
