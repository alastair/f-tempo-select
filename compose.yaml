services:
  ngram:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # package.json builds links for /ngram/; nginx serves stripped paths.
      VIRTUAL_PATH: /ngram/
      VIRTUAL_DEST: /
      VIRTUAL_PORT: "80"
    networks:
      - proxy

networks:
  proxy:
    external: true
    # Use a network already shared by the backend and nginx-proxy.
    name: ${PROXY_NETWORK:-f-tempo-dev_default}
